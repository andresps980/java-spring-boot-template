version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      spring-boot:
        patterns: ["org.springframework.boot*"]
      build-plugins:
        patterns: ["org.jacoco*", "com.diffplug.spotless*", "org.apache.maven.plugins*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
